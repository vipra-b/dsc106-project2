<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSC 106 — Project 2</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { overflow-x: hidden; }
    body { font-family: system-ui, sans-serif; line-height: 1.6; margin: 0; background: #fafafa; color: #1a1a1a; overflow-x: hidden; }
    .wrap { max-width: 52rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    section { margin-bottom: 2.5rem; }
    p { margin: 0 0 1rem; }
    figure.viz-embed { margin: 0; max-width: 100%; }
    figure.viz-embed iframe {
      display: block; width: 100%; max-width: 100%; min-width: 0; height: 780px;
      border: 1px solid #ddd;
      border-radius: 6px; background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <section id="proposition">
      <p></p>
    </section>

    <section id="visualization-a">
      <figure class="viz-embed">
        <iframe src="side_a.html" title="Side A visualization" loading="lazy"></iframe>
      </figure>
      <p></p>
    </section>

    <section id="visualization-b">
      <figure class="viz-embed">
        <iframe src="side_b.html" title="Side B visualization" loading="lazy"></iframe>
      </figure>
      <p></p>
    </section>

    <section id="reflection">
      <p></p>
    </section>
  </div>
</body>
</html>
